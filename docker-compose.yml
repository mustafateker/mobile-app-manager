name: mobile-app-manager-frontend

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-https://apps-backend.triworkster.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
